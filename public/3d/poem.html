<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>名诗 3D 详情</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1020;
        font-family: "Yuanti SC", "YouYuan", "Apple SD Gothic Neo",
          "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .head {
        position: absolute;
        top: 18px;
        left: 22px;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0, 30, 60, 0.7);
        pointer-events: none;
      }
      .head .title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .head .author {
        margin-left: 10px;
        font-size: 13px;
        opacity: 0.85;
      }
      .tabs {
        position: absolute;
        top: 58px;
        left: 22px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        max-width: 60%;
      }
      .tab {
        border: none;
        cursor: pointer;
        padding: 4px 12px;
        border-radius: 999px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        background: rgba(255, 255, 255, 0.16);
      }
      .tab.active {
        color: #5a3b00;
        background: linear-gradient(135deg, #ffe08a, #ffb347);
      }
      .poem {
        position: absolute;
        top: 108px;
        left: 22px;
        z-index: 2;
        max-width: min(680px, calc(100% - 384px));
        max-height: calc(100% - 200px);
        overflow: auto;
        padding: 18px 22px;
        border-radius: 14px;
        color: #fff;
        background: rgba(20, 14, 40, 0.42);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
      }
      .poem .line {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.95;
        letter-spacing: 1px;
      }
      .poem .line.nowrap {
        white-space: nowrap;
      }
      .poem .line.step {
        cursor: pointer;
        transition: color 0.2s;
      }
      .poem .line.step:hover {
        color: #ffe08a;
      }
      .poem .line.active {
        color: #ffe08a;
        text-shadow: 0 0 12px rgba(255, 200, 80, 0.85);
      }
      .narration {
        position: absolute;
        left: 22px;
        right: 340px;
        bottom: 22px;
        z-index: 2;
        padding: 14px 18px;
        border-radius: 14px;
        color: #f4f0ff;
        font-size: 14px;
        line-height: 1.7;
        background: rgba(20, 14, 40, 0.55);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .narration .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: #ffb347;
        vertical-align: middle;
      }
      .intro {
        position: absolute;
        top: 84px;
        right: 22px;
        width: 300px;
        max-height: calc(100% - 190px);
        overflow: auto;
        padding: 16px 18px;
        border-radius: 14px;
        color: #f4f0ff;
        font-size: 13px;
        line-height: 1.85;
        background: rgba(20, 14, 40, 0.55);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      .intro h3 {
        margin: 0 0 8px;
        font-size: 15px;
        letter-spacing: 1px;
        color: #ffd98a;
      }
      .intro p {
        margin: 0 0 10px;
      }
      .intro p:last-child {
        margin-bottom: 0;
      }
      .close {
        position: absolute;
        top: 14px;
        right: 16px;
        z-index: 3;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #fff;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.28);
        transition: background 0.2s;
      }
      .close:hover {
        background: rgba(0, 0, 0, 0.5);
      }
      .empty {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="ui"></div>
    <button class="close" id="close" aria-label="关闭">✕</button>

    <script type="module">

      // ---------- 主题配置 ----------
      const THEMES = {

      // ---------- 工具 ----------
      function makeCloud(THREE, scale) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.82,
          roughness: 1,
          depthWrite: false,
        });
        const n = 4 + Math.floor(Math.random() * 3);
        for (let i = 0; i < n; i++) {
          const s = 1.4 + Math.random() * 1.8;
          const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 10), mat);
          puff.position.set((i - n / 2) * 1.5, Math.random() * 0.6, Math.random() * 0.8);
          puff.scale.y = 0.62;
          g.add(puff);
        }
        g.scale.setScalar(scale);
        return g;
      }

      function makeTree(THREE, kind) {
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 0.22, 1.8, 8),
          new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 })
        );
        trunk.position.y = 0.9;
        g.add(trunk);
        if (kind === "bare") {
          const bmat = new THREE.MeshStandardMaterial({ color: 0x5a4530, roughness: 1 });
          for (let i = 0; i < 4; i++) {
            const br = new THREE.Mesh(
              new THREE.CylinderGeometry(0.03, 0.06, 1.1, 5),
              bmat
            );
            br.position.set(0, 1.7, 0);
            br.rotation.z = (Math.random() - 0.5) * 1.6;
            br.rotation.x = (Math.random() - 0.5) * 1.6;
            g.add(br);
          }
          return g;
        }
        let color = 0x4f8f3a;
        if (kind === "blossom") color = 0xf6b8d0;
        if (kind === "autumn") color = 0xe08a3a;
        if (kind === "plum") color = 0xf3c6dd;
        const fmat = new THREE.MeshStandardMaterial({ color, roughness: 0.9 });
        for (let i = 0; i < 4; i++) {
          const r = 0.7 + Math.random() * 0.5;
          const blob = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), fmat);
          blob.position.set(
            (Math.random() - 0.5) * 1.1,
            1.7 + Math.random() * 0.9,
            (Math.random() - 0.5) * 1.1
          );
          g.add(blob);
        }
        return g;
      }

      function makePine(THREE, snowy) {
        const g = new THREE.Group();
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.1, 0.16, 1.0, 7),
          new THREE.MeshStandardMaterial({ color: 0x5a4126, roughness: 1 })
        );
        trunk.position.y = 0.5;
        g.add(trunk);
        const green = new THREE.MeshStandardMaterial({ color: 0x2f6b46, roughness: 1 });
        const white = new THREE.MeshStandardMaterial({ color: 0xf3f8fb, roughness: 1 });
        for (let i = 0; i < 3; i++) {
          const r = 1.1 - i * 0.28;
          const h = 1.3 - i * 0.2;
          const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 9), green);
          cone.position.y = 1.1 + i * 0.85;
          g.add(cone);
          if (snowy) {
            const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.92, h * 0.5, 9), white);
            cap.position.y = 1.1 + i * 0.85 + h * 0.32;
            g.add(cap);
          }
        }
        return g;
      }

      function makeLotus(THREE) {
        const g = new THREE.Group();
        const padMat = new THREE.MeshStandardMaterial({ color: 0x2f7d4a, roughness: 0.8 });
        const pad = new THREE.Mesh(new THREE.CircleGeometry(0.55, 20), padMat);
        pad.rotation.x = -Math.PI / 2;
        pad.position.y = 0.03;
        g.add(pad);
        if (Math.random() > 0.55) {
          const petalMat = new THREE.MeshStandardMaterial({ color: 0xf7a8c8, roughness: 0.7 });
          for (let i = 0; i < 6; i++) {
            const petal = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.42, 8), petalMat);
            const a = (i / 6) * Math.PI * 2;
            petal.position.set(Math.cos(a) * 0.12, 0.26, Math.sin(a) * 0.12);
            petal.rotation.z = Math.cos(a) * 0.5;
            petal.rotation.x = -Math.sin(a) * 0.5;
            g.add(petal);
          }
          const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.1, 10, 8),
            new THREE.MeshStandardMaterial({ color: 0xffe08a })
          );
          core.position.y = 0.3;
          g.add(core);
        }
        return g;
      }

      function makeReed(THREE) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: 0x6f8f4a, roughness: 1 });
        for (let i = 0; i < 5; i++) {
          const h = 1.4 + Math.random() * 1.6;
          const blade = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, h, 5), mat);
          blade.position.set((Math.random() - 0.5) * 0.5, h / 2, (Math.random() - 0.5) * 0.5);
          blade.rotation.z = (Math.random() - 0.5) * 0.3;
          g.add(blade);
        }
        return g;
      }

      function makeBird(THREE) {
        const g = new THREE.Group();
        const mat = new THREE.MeshBasicMaterial({ color: 0x2a2a3a, side: THREE.DoubleSide });
        const wingGeo = new THREE.PlaneGeometry(0.9, 0.22);
        const lw = new THREE.Mesh(wingGeo, mat);
        lw.position.x = -0.45;
        const rw = new THREE.Mesh(wingGeo, mat);
        rw.position.x = 0.45;
        g.add(lw, rw);
        g.userData = { lw, rw, phase: Math.random() * Math.PI * 2 };
        return g;
      }

      function createScene(THREE, t) {
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(t.fog || t.skyBottom, 45, 130);

        // 天空
        const sky = new THREE.Mesh(
          new THREE.SphereGeometry(100, 32, 16),
          new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            fog: false,
            uniforms: {
              topColor: { value: new THREE.Color(t.skyTop) },
              bottomColor: { value: new THREE.Color(t.skyBottom) },
            },
            vertexShader:
              "varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            fragmentShader:
              "uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vPos; void main(){ float h = normalize(vPos).y*0.5+0.5; gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0); }",
          })
        );
        scene.add(sky);

        // 光
        scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a8a, 1.0));
        const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
        sun.position.set(8, 16, 10);
        scene.add(sun);
        const rim = new THREE.DirectionalLight(0xaac4ff, 0.35);
        rim.position.set(-8, 6, -10);
        scene.add(rim);

        // 云
        const clouds = [];
        const cloudN = t.clouds || 0;
        for (let i = 0; i < cloudN; i++) {
          const c = makeCloud(THREE, 1.6 + Math.random() * 2.4);
          c.position.set(
            -45 + Math.random() * 90,
            16 + Math.random() * 12,
            -30 - Math.random() * 30
          );
          c.userData.sp = 0.3 + Math.random() * 0.5;
          scene.add(c);
          clouds.push(c);
        }

        // 日月
        if (t.moon || t.sun) {
          const isSun = !!t.sun;
          const body = new THREE.Mesh(
            new THREE.SphereGeometry(isSun ? 3.4 : 2.6, 32, 24),
            new THREE.MeshBasicMaterial({ color: isSun ? 0xffd27a : 0xfdf6d8, fog: false })
          );
          body.position.set(isSun ? 18 : 15, isSun ? 8 : 15, -34);
          scene.add(body);
          for (let i = 0; i < 2; i++) {
            const glow = new THREE.Mesh(
              new THREE.SphereGeometry((isSun ? 3.4 : 2.6) * (1.5 + i * 0.6), 24, 18),
              new THREE.MeshBasicMaterial({
                color: isSun ? 0xffb347 : 0xfff6cf,
                transparent: true,
                opacity: 0.18 - i * 0.06,
                fog: false,
                depthWrite: false,
              })
            );
            glow.position.copy(body.position);
            scene.add(glow);
          }
        }

        // 星星
        let starField = null;
        if (t.stars) {
          const N = 400;
          const pos = new Float32Array(N * 3);
          for (let i = 0; i < N; i++) {
            const a = Math.random() * Math.PI * 2;
            const b = Math.random() * Math.PI * 0.45;
            const r = 85;
            pos[i * 3] = Math.cos(a) * Math.cos(b) * r;
            pos[i * 3 + 1] = Math.sin(b) * r + 8;
            pos[i * 3 + 2] = Math.sin(a) * Math.cos(b) * r;
          }
          const sg = new THREE.BufferGeometry();
          sg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          starField = new THREE.Points(
            sg,
            new THREE.PointsMaterial({
              color: 0xffffff,
              size: 0.7,
              transparent: true,
              opacity: 0.9,
              fog: false,
              depthWrite: false,
            })
          );
          scene.add(starField);
        }

        // 远山（多层）
        if (t.mountains) {
          for (let layer = 0; layer < 2; layer++) {
            const shade = layer === 0 ? 0.5 : 0.75;
            const z = -30 - layer * 14;
            const count = 8;
            for (let i = 0; i < count; i++) {
              const h = (layer === 0 ? 7 : 10) + Math.random() * 6;
              const cone = new THREE.Mesh(
                new THREE.ConeGeometry(h * 0.75, h, 5),
                new THREE.MeshStandardMaterial({
                  color: new THREE.Color(t.ground).multiplyScalar(shade),
                  roughness: 1,
                })
              );
              cone.position.set(-46 + i * 12 + Math.random() * 4, h / 2 - 1, z - Math.random() * 6);
              cone.rotation.y = Math.random() * Math.PI;
              scene.add(cone);
            }
          }
        }

        // 沙丘
        if (t.dunes) {
          for (let i = 0; i < 6; i++) {
            const d = new THREE.Mesh(
              new THREE.SphereGeometry(8 + Math.random() * 8, 20, 12),
              new THREE.MeshStandardMaterial({
                color: new THREE.Color(t.ground).multiplyScalar(0.9 + Math.random() * 0.15),
                roughness: 1,
              })
            );
            d.scale.y = 0.16;
            d.position.set(-40 + i * 16, -1.5, -24 - Math.random() * 10);
            scene.add(d);
          }
        }

        // 烽燧
        if (t.tower) {
          const tower = new THREE.Group();
          const base = new THREE.Mesh(
            new THREE.CylinderGeometry(1.5, 2.2, 4, 6),
            new THREE.MeshStandardMaterial({ color: 0x8a6b45, roughness: 1 })
          );
          base.position.y = 2;
          tower.add(base);
          const top = new THREE.Mesh(
            new THREE.BoxGeometry(2.6, 0.5, 2.6),
            new THREE.MeshStandardMaterial({ color: 0x6f5537, roughness: 1 })
          );
          top.position.y = 4.2;
          tower.add(top);
          tower.position.set(12, 0, -20);
          scene.add(tower);
        }

        // 地面 / 水面
        const geo = new THREE.PlaneGeometry(140, 140, 90, 90);
        const mat = t.water
          ? new THREE.MeshStandardMaterial({
              color: t.ground,
              roughness: 0.18,
              metalness: 0.25,
              transparent: true,
              opacity: 0.95,
            })
          : new THREE.MeshStandardMaterial({ color: t.ground, roughness: 0.95 });
        const ground = new THREE.Mesh(geo, mat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        const baseZ = Float32Array.from(geo.attributes.position.array);

        // 主题植被
        const swayers = [];
        if (t.lotus) {
          for (let i = 0; i < t.lotus; i++) {
            const l = makeLotus(THREE);
            l.position.set((Math.random() - 0.5) * 60, 0, (Math.random() - 0.5) * 60);
            l.rotation.y = Math.random() * Math.PI;
            l.scale.setScalar(0.8 + Math.random() * 0.7);
            scene.add(l);
          }
        }
        if (t.reeds) {
          for (let i = 0; i < t.reeds; i++) {
            const r = makeReed(THREE);
            r.position.set((Math.random() - 0.5) * 70, 0, -8 - Math.random() * 30);
            r.rotation.y = Math.random() * Math.PI;
            scene.add(r);
            swayers.push(r);
          }
        }
        if (t.pines) {
          for (let i = 0; i < t.pines; i++) {
            const p = makePine(THREE, true);
            p.position.set((Math.random() - 0.5) * 90, 0, -6 - Math.random() * 40);
            p.scale.setScalar(0.9 + Math.random() * 0.9);
            scene.add(p);
          }
        }
        if (t.trees) {
          for (let i = 0; i < 16; i++) {
            const tr = makeTree(THREE, t.trees);
            tr.position.set((Math.random() - 0.5) * 95, 0, -4 - Math.random() * 42);
            tr.scale.setScalar(0.8 + Math.random() * 0.9);
            tr.rotation.y = Math.random() * Math.PI;
            scene.add(tr);
          }
        }
        if (t.grass) {
          const gmat = new THREE.MeshStandardMaterial({ color: 0x6fb055, roughness: 1 });
          for (let i = 0; i < 120; i++) {
            const blade = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.5 + Math.random() * 0.4, 4), gmat);
            blade.position.set((Math.random() - 0.5) * 90, 0.25, (Math.random() - 0.5) * 90);
            blade.rotation.z = (Math.random() - 0.5) * 0.4;
            scene.add(blade);
          }
        }

        // 飞鸟
        const birds = [];
        for (let i = 0; i < (t.birds || 0); i++) {
          const b = makeBird(THREE);
          b.position.set(-30 + Math.random() * 60, 10 + Math.random() * 8, -25 - Math.random() * 20);
          b.scale.setScalar(0.8 + Math.random() * 0.8);
          b.userData.a = Math.random() * Math.PI * 2;
          b.userData.r = 14 + Math.random() * 16;
          b.userData.cx = (Math.random() - 0.5) * 20;
          scene.add(b);
          birds.push(b);
        }

        // 粒子
        const COUNT =
          t.particle === "stars" || t.particle === "none"
            ? 0
            : t.particle === "rain"
              ? 900
              : 700;
        let points = null;
        let pGeo = null;
        const speeds = new Float32Array(COUNT);
        if (COUNT > 0) {
          const positions = new Float32Array(COUNT * 3);
          for (let i = 0; i < COUNT; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 100;
            positions[i * 3 + 1] = Math.random() * 34;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
            speeds[i] = 0.5 + Math.random() * 1.6;
          }
          pGeo = new THREE.BufferGeometry();
          pGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          const size =
            t.particle === "snow"
              ? 0.5
              : t.particle === "rain"
                ? 0.28
                : t.particle === "lantern"
                  ? 0.9
                  : 0.55;
          points = new THREE.Points(
            pGeo,
            new THREE.PointsMaterial({
              color: t.particleColor,
              size,
              transparent: true,
              opacity: t.particle === "rain" ? 0.55 : 0.88,
              depthWrite: false,
            })
          );
          scene.add(points);
        }

        const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.1, 400);
        camera.position.set(0, 6, 20);
        const look = new THREE.Vector3(0, 3.5, 0);
        camera.lookAt(look);

        function update(tm, dt) {
          if (t.water) {
            const p = geo.attributes.position;
            for (let i = 0; i < p.count; i++) {
              const x = baseZ[i * 3];
              const y = baseZ[i * 3 + 1];
              p.array[i * 3 + 2] =
                Math.sin(x * 0.35 + tm * 1.1) * 0.16 +
                Math.cos(y * 0.3 + tm * 0.8) * 0.13;
            }
            p.needsUpdate = true;
            geo.computeVertexNormals();
          }

          if (points) {
            const pos = pGeo.attributes.position;
            for (let i = 0; i < COUNT; i++) {
              const iy = i * 3 + 1;
              if (t.particle === "rain") {
                pos.array[iy] -= speeds[i] * dt * 26;
                if (pos.array[iy] < 0) pos.array[iy] = 34;
              } else if (t.particle === "lantern") {
                pos.array[iy] += speeds[i] * dt * 1.1;
                pos.array[i * 3] += Math.sin(tm * 0.8 + i) * dt * 0.8;
                if (pos.array[iy] > 34) pos.array[iy] = 0;
              } else {
                pos.array[iy] -= speeds[i] * dt * 2.4;
                pos.array[i * 3] += Math.sin(tm + i) * dt * 0.5;
                if (pos.array[iy] < 0) pos.array[iy] = 34;
              }
            }
            pos.needsUpdate = true;
          }

          if (starField) starField.rotation.y = tm * 0.01;

          clouds.forEach((c) => {
            c.position.x += c.userData.sp * dt;
            if (c.position.x > 55) c.position.x = -55;
          });

          birds.forEach((b) => {
            b.userData.a += dt * 0.6;
            b.position.x = b.userData.cx + Math.cos(b.userData.a) * b.userData.r;
            b.position.z = -28 + Math.sin(b.userData.a) * b.userData.r * 0.5;
            b.rotation.y = -b.userData.a + Math.PI / 2;
            const flap = Math.sin(tm * 8 + b.userData.phase) * 0.5;
            b.userData.lw.rotation.z = flap;
            b.userData.rw.rotation.z = -flap;
          });

          swayers.forEach((r, i) => {
            r.rotation.z = Math.sin(tm * 1.2 + i) * 0.06;
          });

          camera.position.x = Math.sin(tm * 0.05) * 3.2;
          camera.position.y = 6 + Math.sin(tm * 0.09) * 0.7;
          camera.lookAt(look);
        }

        function dispose() {
          scene.traverse((o) => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              mats.forEach((m) => m.dispose());
            }
          });
        }

        return { scene, camera, update, dispose };
      }

      // ---------- 《咏鹅》专属场景 ----------
      function createGooseScene(THREE) {
        const scene = new THREE.Scene();

        const sky = new THREE.Mesh(
          new THREE.SphereGeometry(90, 32, 16),
          new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            uniforms: {
              topColor: { value: new THREE.Color(0x7ec8ff) },
              bottomColor: { value: new THREE.Color(0xf3fbff) },
            },
            vertexShader:
              "varying vec3 vPos; void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
            fragmentShader:
              "uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vPos; void main(){ float h = normalize(vPos).y*0.5+0.5; gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0); }",
          })
        );
        scene.add(sky);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x8fbf9a, 0.95));
        const sun = new THREE.DirectionalLight(0xfff4e0, 1.25);
        sun.position.set(7, 13, 9);
        scene.add(sun);

        const waterGeo = new THREE.PlaneGeometry(80, 80, 96, 96);
        const water = new THREE.Mesh(
          waterGeo,
          new THREE.MeshStandardMaterial({
            color: 0x2f9e6e,
            roughness: 0.22,
            metalness: 0.15,
            transparent: true,
            opacity: 0.95,
          })
        );
        water.rotation.x = -Math.PI / 2;
        scene.add(water);
        const baseZ = Float32Array.from(waterGeo.attributes.position.array);

        const goose = new THREE.Group();
        const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 });
        const white2 = new THREE.MeshStandardMaterial({ color: 0xeef4ff, roughness: 0.6 });
        const orange = new THREE.MeshStandardMaterial({ color: 0xff9f1c, roughness: 0.5 });
        const red = new THREE.MeshStandardMaterial({ color: 0xff4d2e, roughness: 0.5 });
        const dark = new THREE.MeshStandardMaterial({ color: 0x222222 });

        const body = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), white);
        body.scale.set(1.55, 1.0, 1.05);
        body.position.set(0, 0.6, 0);
        goose.add(body);

        for (const s of [-1, 1]) {
          const wing = new THREE.Mesh(new THREE.SphereGeometry(0.72, 24, 18), white2);
          wing.scale.set(0.95, 0.5, 0.32);
          wing.position.set(-0.12, 0.72, s * 0.86);
          wing.rotation.x = s * 0.22;
          goose.add(wing);
        }

        const tail = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.95, 18), white);
        tail.position.set(-1.4, 0.8, 0);
        tail.rotation.z = Math.PI / 2 + 0.55;
        goose.add(tail);

        const neckPts = [
          new THREE.Vector3(0.78, 0.72, 0),
          new THREE.Vector3(1.16, 1.4, 0),
          new THREE.Vector3(1.18, 2.05, 0),
          new THREE.Vector3(0.92, 2.55, 0),
        ];
        const neckCurve = new THREE.CatmullRomCurve3(neckPts);
        goose.add(
          new THREE.Mesh(new THREE.TubeGeometry(neckCurve, 48, 0.2, 16, false), white)
        );

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 28, 20), white);
        head.position.copy(neckPts[3]);
        goose.add(head);

        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.52, 16), orange);
        beak.position.set(neckPts[3].x + 0.06, neckPts[3].y + 0.36, 0);
        beak.rotation.z = -0.35;
        goose.add(beak);

        for (const s of [-1, 1]) {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 12), dark);
          eye.position.set(neckPts[3].x + 0.22, neckPts[3].y + 0.08, s * 0.15);
          goose.add(eye);
        }

        const feet = [];
        for (const s of [-1, 1]) {
          const leg = new THREE.Group();
          const shank = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 10), red);
          shank.position.y = -0.25;
          leg.add(shank);
          const palm = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), red);
          palm.scale.set(0.7, 0.18, 1.15);
          palm.position.set(0.16, -0.5, 0);
          leg.add(palm);
          leg.position.set(0.32, 0.16, s * 0.36);
          goose.add(leg);
          feet.push(leg);
        }
        scene.add(goose);

        const ripples = [];
        for (let i = 0; i < 4; i++) {
          const r = new THREE.Mesh(
            new THREE.RingGeometry(0.95, 1.08, 56),
            new THREE.MeshBasicMaterial({
              color: 0xe6fff2,
              transparent: true,
              opacity: 0.5,
              side: THREE.DoubleSide,
            })
          );
          r.rotation.x = -Math.PI / 2;
          r.position.y = 0.02;
          r.userData.t = i * 0.9;
          scene.add(r);
          ripples.push(r);
        }

        const feathers = [];
        for (let i = 0; i < 6; i++) {
          const f = new THREE.Mesh(
            new THREE.PlaneGeometry(0.24, 0.5),
            new THREE.MeshStandardMaterial({
              color: 0xffffff,
              roughness: 0.6,
              side: THREE.DoubleSide,
            })
          );
          f.rotation.x = -Math.PI / 2;
          f.position.y = 0.05;
          f.userData = {
            a: Math.random() * Math.PI * 2,
            r: 2.4 + Math.random() * 3.6,
            sp: 0.12 + Math.random() * 0.18,
          };
          scene.add(f);
          feathers.push(f);
        }

        const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 300);
        const views = [
          { pos: new THREE.Vector3(6.6, 4.4, 8.8), look: new THREE.Vector3(0, 1.2, 0) },
          { pos: new THREE.Vector3(3.1, 3.7, 4.8), look: new THREE.Vector3(1.05, 2.15, 0) },
          { pos: new THREE.Vector3(2.4, 1.9, 6.6), look: new THREE.Vector3(0, 0.55, 0) },
          { pos: new THREE.Vector3(3.7, 1.25, 4.3), look: new THREE.Vector3(0.35, -0.2, 0) },
        ];
        const camTarget = views[0].pos.clone();
        const lookTarget = views[0].look.clone();
        const curLook = lookTarget.clone();
        camera.position.copy(camTarget);
        camera.lookAt(curLook);

        function setStep(i) {
          const v = views[Math.max(0, Math.min(views.length - 1, i))];
          camTarget.copy(v.pos);
          lookTarget.copy(v.look);
        }

        function update(tm, dt) {
          const p = waterGeo.attributes.position;
          for (let i = 0; i < p.count; i++) {
            const x = baseZ[i * 3];
            const y = baseZ[i * 3 + 1];
            p.array[i * 3 + 2] =
              Math.sin(x * 0.6 + tm * 1.2) * 0.12 +
              Math.cos(y * 0.5 + tm * 0.9) * 0.1;
          }
          p.needsUpdate = true;
          waterGeo.computeVertexNormals();

          goose.position.y = 0.15 + Math.sin(tm * 1.3) * 0.06;
          goose.rotation.z = Math.sin(tm * 0.8) * 0.03;
          goose.rotation.x = Math.sin(tm * 1.1) * 0.02;

          head.position.y = neckPts[3].y + Math.sin(tm * 1.6) * 0.05;
          beak.position.y = head.position.y + 0.36;
          beak.rotation.z = -0.35 + Math.sin(tm * 1.6) * 0.08;

          feet.forEach((leg, idx) => {
            leg.rotation.x = Math.sin(tm * 3 + idx * Math.PI) * 0.6;
          });

          ripples.forEach((r) => {
            r.userData.t += dt * 0.5;
            const k = r.userData.t % 1;
            r.scale.setScalar(1 + k * 3.4);
            r.material.opacity = 0.5 * (1 - k);
          });

          feathers.forEach((f) => {
            const d = f.userData;
            d.a += d.sp * dt;
            f.position.x = Math.cos(d.a) * d.r;
            f.position.z = Math.sin(d.a) * d.r;
            f.rotation.z += dt * 0.6;
          });

          const k = 1 - Math.pow(0.0015, dt);
          camera.position.lerp(camTarget, k);
          curLook.lerp(lookTarget, k);
          camera.lookAt(curLook);
        }

        function dispose() {
          scene.traverse((o) => {
            if (o.geometry) o.geometry.dispose();
            if (o.material) {
              const mats = Array.isArray(o.material) ? o.material : [o.material];
              mats.forEach((m) => m.dispose());
            }
          });
        }

        return { scene, camera, update, dispose, setStep };
      }

      // ---------- 渲染 ----------
      const params = new URLSearchParams(location.search);
      const keys = (params.get("p") || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);
      const valid = keys.filter((k) => poemLoaders[k]);
      const cache = {};

      // 按需加载指定诗词的配置
      async function getPoem(key) {
        if (!cache[key]) {
          const mod = await poemLoaders[key]();
          cache[key] = mod.default;
        }
        return cache[key];
      }

      const ui = document.getElementById("ui");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.getElementById("scene").appendChild(renderer.domElement);

      let api = null;

      function esc(s) {
        return String(s).replace(/[&<>"]/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])
        );
      }

      let step = 0;
      let stepTimer = 0;
      let currentSteps = null;

      function setStep(i) {
        step = i;
        ui.querySelectorAll(".line").forEach((el, k) =>
          el.classList.toggle("active", k === i)
        );
        const narr = document.getElementById("narr");
        if (narr && currentSteps) narr.textContent = currentSteps[i] || "";
        if (api && api.setStep) api.setStep(i);
      }
      function startSteps() {
        clearInterval(stepTimer);
        if (!currentSteps) return;
        stepTimer = setInterval(
          () => setStep((step + 1) % currentSteps.length),
          5000
        );
      }

      function renderUI(key, d) {
        // 按句号（含！？）拆分成句，逐句成行
        const lines = (d.lines || [])
          .flatMap((l) => l.match(/[^。！？]*[。！？]+|[^。！？]+/g) || [l])
          .map((s) => s.trim())
          .filter(Boolean);
        const hasSteps = Array.isArray(d.steps) && d.steps.length > 0;
        const tabs =
          valid.length > 1
            ? `<div class="tabs">${valid
                .map(
                  (k) =>
                    `<button class="tab${
                      k === key ? " active" : ""
                    }" data-k="${esc(k)}">${esc(k)}</button>`
                )
                .join("")}</div>`
            : "";
        ui.innerHTML = `
          <div class="head">
            <span class="title">《${esc(d.title || key)}》</span>
            <span class="author">${esc(d.author || "")}</span>
          </div>
          ${tabs}
          <div class="poem">
            ${lines
              .map(
                (l, i) =>
                  `<div class="line${l.length <= 42 ? " nowrap" : ""}${
                    hasSteps ? " step" : ""
                  }" data-i="${i}">${esc(l)}</div>`
              )
              .join("")}
          </div>
          <div class="intro">
            <h3>背景介绍</h3>
            ${(d.bg || []).map((p) => `<p>${esc(p)}</p>`).join("")}
          </div>
          <div class="narration"><span class="dot"></span><span id="narr">${esc(
            d.note || ""
          )}</span></div>
        `;
        ui.querySelectorAll(".tab").forEach((b) =>
          b.addEventListener("click", () => show(b.dataset.k))
        );
        if (hasSteps) {
          ui.querySelectorAll(".line.step").forEach((el) =>
            el.addEventListener("click", () => setStep(+el.dataset.i))
          );
        }
      }

      function buildScene(d) {
        if (api) api.dispose();
        api = null;
        if (d.custom === "goose") {
          api = createGooseScene(THREE);
          return;
        }
        const cfg = Object.assign(
          {},
          THEMES[d.theme] || THEMES.plain,
          d.scene || {}
        );
        api = createScene(THREE, cfg);
      }

      async function show(key) {
        const d = await getPoem(key);
        currentSteps =
          Array.isArray(d.steps) && d.steps.length ? d.steps : null;
        step = 0;
        clearInterval(stepTimer);
        renderUI(key, d);
        buildScene(d);
        if (currentSteps) {
          setStep(0);
          startSteps();
        }
      }

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h, false);
        if (api) {
          api.camera.aspect = w / h;
          api.camera.updateProjectionMatrix();
        }
      }
      window.addEventListener("resize", resize);

      if (!valid.length) {
        ui.innerHTML = '<div class="empty">暂无该名句的详情</div>';
      } else {
        show(valid[0]).then(resize);
        const clock = new THREE.Clock();
        (function loop() {
          const dt = Math.min(clock.getDelta(), 0.05);
          if (api) {
            api.update(clock.elapsedTime, dt);
            renderer.render(api.scene, api.camera);
          }
          requestAnimationFrame(loop);
        })();
      }

      document.getElementById("close").addEventListener("click", () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "poem-close" }, "*");
        } else {
          window.close();
        }
      });
    </script>
  </body>
</html>
